# Reusable review workflow, publish mode: like review.yml, and it also comments on the pull request
# as github-actions[bot], or as a GitHub App when app-slug and its two secrets are set: threads for
# findings, a sticky summary, a check run per agent and the MNG Review commit status, never an
# approval. The caller grants pull-requests, checks and statuses write. Two jobs: `review` holds
# the endpoint secrets and a read-only token and makes every model call; `publish` holds the write
# token and the app key, downloads the outcome and posts it without a model call.
# The review job shares its steps with review.yml in .github/actions/review.
# The caller owns the trigger and the concurrency; see "GitHub Actions" in README.md.
# Nothing from the caller's repository is installed, built or run: its base commit is checked out
# only so git can read the change, and the rules come from that base commit.
name: MNG Review (publish)

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for the job.
        type: string
        default: ubuntu-latest
      tailscale:
        description: Join a tailnet as an ephemeral node before the review, to reach a private endpoint.
        type: boolean
        default: false
      tailscale-tags:
        description: Comma-separated tags for the ephemeral node; the OAuth client must own them.
        type: string
        default: tag:ci
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 20
      app-slug:
        description: Slug of the GitHub App the bot posts as. Empty posts as github-actions[bot].
        type: string
        default: ''
    secrets:
      llm-url:
        description: Base URL of the OpenAI-compatible endpoint, such as https://llm.example.com/v1.
        required: true
      llm-key:
        description: Key sent to the endpoint as a bearer token.
        required: true
      tailscale-oauth-client-id:
        description: Tailscale OAuth client id, needed when tailscale is true.
        required: false
      tailscale-oauth-secret:
        description: Tailscale OAuth client secret, needed when tailscale is true.
        required: false
      app-client-id:
        description: Client id of the GitHub App, needed when app-slug is set.
        required: false
      app-private-key:
        description: Private key of the GitHub App, needed when app-slug is set.
        required: false

permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write

jobs:
  review:
    name: MNG Review (review)
    # Only a pull request from this repository gets the job, its secrets and the tailnet; the entry
    # skips forks and other events too.
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ inputs.runner }}
    # Read only: this job holds the endpoint and never writes to GitHub.
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      publish: ${{ steps.review.outputs.publish }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Without these (GitHub Enterprise Server), checkout would fall back to the caller's repository.
      - name: Check the workflow's own commit
        if: job.workflow_repository == '' || job.workflow_sha == ''
        run: |
          echo "::error::job.workflow_repository and job.workflow_sha are not available on this GitHub; MNG Review cannot check out its own code."
          exit 1

      # The base commit only, never the head; credentials are not left in .git/config.
      - name: Check out the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: repo
          fetch-depth: 0
          persist-credentials: false

      # Objects only: the head commit is never checked out, and git reads it with `git show`.
      - name: Fetch the head commit
        working-directory: repo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --no-tags --quiet origin "$HEAD_SHA"
          git cat-file -e "$HEAD_SHA^{commit}"

      - name: Check out MNG Review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .mng-review-engine
          persist-credentials: false

      # Keep the steps above in step with review.yml; the rest is shared. The read token reaches
      # the prepare step alone, never the step that calls the model. The slug only tells the prepare
      # step which bot wrote the summary and the threads; this job holds no app secret.
      - name: Review
        id: review
        uses: ./.mng-review-engine/.github/actions/review
        with:
          mode: publish
          engine-commit: ${{ job.workflow_sha }}
          token: ${{ github.token }}
          app-slug: ${{ inputs.app-slug }}
          llm-url: ${{ secrets.llm-url }}
          llm-key: ${{ secrets.llm-key }}
          tailscale: ${{ inputs.tailscale }}
          tailscale-tags: ${{ inputs.tailscale-tags }}
          tailscale-oauth-client-id: ${{ secrets.tailscale-oauth-client-id }}
          tailscale-oauth-secret: ${{ secrets.tailscale-oauth-secret }}

  publish:
    name: MNG Review (publish)
    # Only a reviewed or offline outcome is posted; a failed or skipped review job skips this one.
    needs: review
    if: needs.review.outputs.publish == 'true'
    runs-on: ${{ inputs.runner }}
    # No endpoint or tailnet secret is named here, and the job never joins the tailnet. In app mode
    # the job token keeps write, since permissions are static text, but only checks out and fetches.
    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Without these (GitHub Enterprise Server), checkout would fall back to the caller's repository.
      - name: Check the workflow's own commit
        if: job.workflow_repository == '' || job.workflow_sha == ''
        run: |
          echo "::error::job.workflow_repository and job.workflow_sha are not available on this GitHub; MNG Review cannot check out its own code."
          exit 1

      # The base commit only, never the head; credentials are not left in .git/config.
      - name: Check out the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: repo
          fetch-depth: 0
          persist-credentials: false

      # Objects only: the head commit is never checked out, and git reads it with `git show`.
      - name: Fetch the head commit
        working-directory: repo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --no-tags --quiet origin "$HEAD_SHA"
          git cat-file -e "$HEAD_SHA^{commit}"

      - name: Check out MNG Review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .mng-review-engine
          persist-credentials: false

      # Keep the steps above in step with the review job.
      # All three app settings, or none: anything else fails here, before any write.
      - name: Check the app credentials
        env:
          APP_SLUG: ${{ inputs.app-slug }}
          HAS_CLIENT_ID: ${{ secrets.app-client-id != '' }}
          HAS_PRIVATE_KEY: ${{ secrets.app-private-key != '' }}
        run: |
          if [ -n "$APP_SLUG" ]; then
            if [ "$HAS_CLIENT_ID" != true ] || [ "$HAS_PRIVATE_KEY" != true ]; then
              echo "::error::app-slug is set, so app-client-id and app-private-key are required."
              exit 1
            fi
          elif [ "$HAS_CLIENT_ID" = true ] || [ "$HAS_PRIVATE_KEY" = true ]; then
            echo "::error::app-client-id or app-private-key is set without app-slug."
            exit 1
          fi

      # The calling repository only and the listed permissions only; revoked when the job ends.
      - name: Mint the app token
        id: app
        if: inputs.app-slug != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-pull-requests: write
          permission-checks: write
          permission-statuses: write
          # Review threads read through GraphQL name each comment's commit, which needs contents read.
          permission-contents: read

      # In app mode the entry gets the app token and never the job token.
      - name: Publish
        uses: ./.mng-review-engine/.github/actions/publish
        with:
          engine-commit: ${{ job.workflow_sha }}
          token: ${{ inputs.app-slug == '' && github.token || '' }}
          app-slug: ${{ inputs.app-slug }}
          app-token: ${{ steps.app.outputs.token }}
          app-token-slug: ${{ steps.app.outputs.app-slug }}
