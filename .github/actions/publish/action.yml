# The publish job's steps once the base commit, the head objects and MNG Review are checked out:
# install, download this run's outcome and result, publish, upload the result with what was posted.
# Only the publish jobs of review-publish.yml, review-command.yml and review-converse.yml use it,
# from the engine checkout at the workflow's own commit. Nothing here calls the model or holds an endpoint secret.
name: MNG Review publish steps
description: Posts the outcome the review job of this run uploaded, and calls no model.

inputs:
  engine-commit:
    description: The commit of MNG Review that runs.
    required: true
  token:
    description: >-
      The job token with pull requests, checks and statuses write; empty in app mode, where the
      entry gets the app token instead.
    required: false
    default: ''
  app-slug:
    description: Slug of the GitHub App the bot posts as; empty for github-actions[bot].
    required: false
    default: ''
  app-token:
    description: The installation token minted in this job; app mode only.
    required: false
    default: ''
  app-token-slug:
    description: The slug of the app the token was minted for, checked against app-slug.
    required: false
    default: ''
  trigger:
    description: >-
      push (a pull request event), command (the target inputs, from the authorize job, name the
      pull request and its commits) or converse (the same, from the reply schedule's find job; a
      missing outcome means nothing to answer and passes).
    required: false
    default: push
  target-pr:
    description: Command and converse mode, the pull request number from the authorize or find job.
    required: false
    default: ''
  target-base:
    description: Command and converse mode, the base commit the authorize or find job checked.
    required: false
    default: ''
  target-head:
    description: Command and converse mode, the head commit the authorize or find job checked.
    required: false
    default: ''
  command-depth:
    description: Command mode only, deep, quick or empty.
    required: false
    default: ''
  command-agent:
    description: Command mode only, the declared agent the command named, or empty.
    required: false
    default: ''
  outcome-name:
    description: Name of the outcome artifact the review job uploaded.
    required: false
    default: mng-review-outcome
  result-name:
    description: Name of the result artifact the review job uploaded.
    required: false
    default: mng-review-result

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ github.action_path }}/../../../package.json
        no-cache: true

    - name: Install MNG Review
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: bun install --frozen-lockfile --production --ignore-scripts

    # No run-id and no github-token: only this run's artifacts can be read. The reply schedule's
    # review leg uploads none when it has nothing to answer; the entry then passes.
    - name: Download the outcome
      continue-on-error: ${{ inputs.trigger == 'converse' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.outcome-name }}
        path: ${{ runner.temp }}/mng-review-outcome

    - name: Download the result
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.result-name }}
        path: ${{ runner.temp }}/mng-review-result

    # The outcome file is checked against this job's own run, attempt, engine commit and event
    # before anything is posted; the rules come from the base commit again.
    - name: Publish
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        MNG_REVIEW_MODE: publish
        MNG_REVIEW_ENGINE_COMMIT: ${{ inputs.engine-commit }}
        MNG_REVIEW_REPO_DIR: ${{ github.workspace }}/repo
        MNG_REVIEW_OUTCOME_PATH: ${{ runner.temp }}/mng-review-outcome/outcome.json
        MNG_REVIEW_RESULT_PATH: ${{ runner.temp }}/mng-review-result/result.json
        MNG_REVIEW_APP_SLUG: ${{ inputs.app-slug }}
        MNG_REVIEW_APP_TOKEN: ${{ inputs.app-token }}
        MNG_REVIEW_MINTED_APP_SLUG: ${{ inputs.app-token-slug }}
        MNG_REVIEW_TRIGGER: ${{ inputs.trigger }}
        MNG_REVIEW_TARGET_PR: ${{ inputs.target-pr }}
        MNG_REVIEW_TARGET_BASE: ${{ inputs.target-base }}
        MNG_REVIEW_TARGET_HEAD: ${{ inputs.target-head }}
        MNG_REVIEW_COMMAND_DEPTH: ${{ inputs.command-depth }}
        MNG_REVIEW_COMMAND_AGENT: ${{ inputs.command-agent }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: bun --no-env-file apps/action/src/main.ts

    # The result again, with `publish` saying what was posted.
    - name: Upload the result
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.result-name }}
        path: ${{ runner.temp }}/mng-review-result/result.json
        retention-days: 14
        if-no-files-found: warn
        overwrite: true
